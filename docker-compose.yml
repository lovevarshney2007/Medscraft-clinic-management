version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medscraft_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=medscraft_super_secure_jwt_secret_key_2026_xyz
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medscraft_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
